name: Test error when no tag inputs are provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record CHANGELOG state
        run: |
          if [ -f CHANGELOG.md ]; then sha256sum CHANGELOG.md > /tmp/changelog.sha; else echo none > /tmp/changelog.sha; fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
      - name: Assert action failed and wrote nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGES: ${{ steps.action.outputs.changes }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changes: $CHANGES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when neither tag nor fromTag/toTag are given"
            exit 1
          fi
          if [ -n "$CHANGES" ]; then
            echo "FAIL: expected empty changes output"
            exit 1
          fi
          if [ -f CHANGELOG.md ]; then
            sha256sum -c /tmp/changelog.sha || { echo "FAIL: CHANGELOG.md was modified"; exit 1; }
          else
            grep -q none /tmp/changelog.sha || { echo "FAIL: CHANGELOG.md disappeared"; exit 1; }
          fi
          echo "PASS"
