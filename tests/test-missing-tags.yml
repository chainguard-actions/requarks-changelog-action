name: Test missing tag inputs fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          writeToFile: 'false'
      - name: Assert action failed with no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGES: ${{ steps.action.outputs.changes }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changes: $CHANGES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when neither tag nor fromTag/toTag provided"
            exit 1
          fi
          if [ -n "$CHANGES" ]; then
            echo "FAIL: expected no changes output"
            exit 1
          fi
          echo "PASS"
